server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;
    # Shared by API and diagnostics; readiness checks dependencies sequentially.
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location = /gateway-health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(healthz|readyz|metrics|openapi.json|docs|redoc)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
    }
    # The optional development gateway is bound to loopback only; never expose these diagnostics publicly.
    location / { try_files $uri $uri/ /index.html; }
}
