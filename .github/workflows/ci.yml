name: Verify complete learning stack
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.4 pyyaml==6.0.3
      - run: uv sync --frozen
      - name: Backend lint and unit tests (no infrastructure mocks counted as integration)
        run: |
          uv run ruff check backend tests/judge tests/integration scripts/infra-init-env.py scripts/test-http-smoke.py scripts/test-build-context.py
          uv run pytest backend/tests tests/judge/test_capture.py -m 'not integration' --junitxml=artifacts/unit.xml
      - name: Validate manifests without connecting to a daemon
        run: |
          python scripts/infra-init-env.py
          docker compose config --quiet
          python scripts/infra-validate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-evidence
          path: artifacts/unit.xml
          if-no-files-found: warn
  compose-integration:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate ephemeral development credentials
        run: python scripts/infra-init-env.py
      - name: Verify private files are excluded from Docker build contexts
        run: python scripts/test-build-context.py
      - name: Build actual application containers
        run: docker compose build
      - name: Start only isolated CI stores before any migration or application process
        run: |
          mkdir -p test-results
          chmod 777 test-results
          docker compose -f compose.yaml -f compose.test.yaml build integration
          docker compose up -d --no-deps --wait --wait-timeout 300 mysql redis mongo kafka
      - name: Prove frozen v1 upgrade, legacy-row preservation, repeat migration and version guards
        run: |
          docker compose -f compose.yaml -f compose.test.yaml run --rm --no-deps \
            -e CI=true -e LAB_CI_EPHEMERAL_SCHEMA=1 integration -q \
            /tests/integration/test_schema_upgrade.py::test_frozen_v1_upgrade_repeat_and_future_version_guard \
            --junitxml=/reports/schema-upgrade.xml
      - name: Start backend-only core on upgraded v2 schema (frontend and gateway not required)
        run: docker compose up -d --wait --wait-timeout 300
      - name: Verify legacy auth and task ownership survived real API and Worker startup
        run: |
          docker compose -f compose.yaml -f compose.test.yaml run --rm --no-deps \
            -e CI=true -e LAB_CI_EPHEMERAL_SCHEMA=1 integration -q \
            /tests/integration/test_schema_upgrade.py::test_upgraded_legacy_password_session_task_and_ownership_after_start \
            --junitxml=/reports/schema-upgrade-http.xml
      - name: Execute documented standard-library HTTP main-function smoke
        env:
          TEST_BASE_URL: http://localhost:8080
        run: python scripts/test-http-smoke.py
      - name: Real MySQL / Kafka / MongoDB / Redis integration and failure recovery
        run: bash scripts/test-integration.sh
      - name: Verify four precise SIGKILL boundaries and hook-free recovery
        run: bash scripts/test-crash-windows.sh
      - name: Capture frozen judge cases (capture integrity only, not semantic acceptance)
        env:
          JUDGE_COMMIT: ${{ github.sha }}
        run: |
          docker compose -f compose.yaml -f compose.test.yaml run --rm --no-deps \
            -e JUDGE_COMMIT -e PYTHONPATH=/app --entrypoint python integration \
            /tests/judge/capture.py --output /reports/judge-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: judge-sanitized-evidence
          path: test-results/judge-evidence.json
          if-no-files-found: error
      - name: Capture state and redacted logs
        if: always()
        run: |
          mkdir -p artifacts/compose
          docker compose ps --all > artifacts/compose/services.txt
          docker compose logs --no-color --tail=200 2>&1 | python scripts/infra-redact.py > artifacts/compose/services.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-real-integration-evidence
          path: |
            artifacts/
            test-results/*.xml
            test-results/crash-windows.json
            !test-results/outage-state.json
            !test-results/**/outage-state.json
            !test-results/playground-state.json
            !test-results/**/playground-state.json
            !test-results/crash-state.json
            !test-results/**/crash-state.json
          if-no-files-found: warn
      - name: Destroy CI-only ephemeral data
        if: always()
        run: docker compose down --volumes --remove-orphans
  frontend-browser:
    # Separate runner and job: UI verification never replaces backend-only tests above.
    # Supported Jammy runner keeps Chromium's sandbox enabled without changing host security policy.
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package-lock.json
      - name: Frontend clean install, typecheck and production build
        working-directory: frontend
        run: |
          npm ci --no-audit
          npm run typecheck
          npm test
          npm run build
      - name: Generate private credentials and validate opt-in UI overlay
        run: |
          python scripts/infra-init-env.py
          docker compose -f compose.yaml -f compose.ui.yaml config --quiet
      - name: Verify private files are excluded from Docker build contexts
        run: python scripts/test-build-context.py
      - name: Build and start real backend with same-origin UI gateway
        run: |
          docker compose -f compose.yaml -f compose.ui.yaml build
          docker compose -f compose.yaml -f compose.ui.yaml up -d --wait --wait-timeout 300
      - name: Real Chromium desktop and mobile end-to-end tests
        env:
          TEST_BASE_URL: http://localhost:8081
          CI: 'true'
        run: bash scripts/test-e2e.sh
      - name: Capture redacted UI-stack diagnostics
        if: always()
        run: |
          mkdir -p artifacts/ui
          docker compose -f compose.yaml -f compose.ui.yaml ps --all > artifacts/ui/services.txt
          docker compose -f compose.yaml -f compose.ui.yaml logs --no-color --tail=200 2>&1 | python scripts/infra-redact.py > artifacts/ui/services.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-evidence
          # Never upload traces, storageState, cookies, session/outage JSON, .env or an entire test directory.
          path: |
            artifacts/ui/services.txt
            artifacts/ui/services.log
            test-results/browser.xml
            test-results/browser-artifacts/**/*.png
            test-results/browser-artifacts/**/judge-observations.json
            !test-results/**/outage-state.json
            !test-results/playground-state.json
            !test-results/**/playground-state.json
            !test-results/crash-state.json
            !test-results/**/crash-state.json
            !test-results/**/storageState.json
            !test-results/**/*.zip
          if-no-files-found: warn
      - name: Destroy CI-only UI-stack data
        if: always()
        run: docker compose -f compose.yaml -f compose.ui.yaml down --volumes --remove-orphans
