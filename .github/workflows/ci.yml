name: Verify complete learning stack
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.4 pyyaml==6.0.3
      - run: uv sync --frozen
      - name: Backend lint and unit tests (no infrastructure mocks counted as integration)
        run: |
          uv run ruff check backend
          uv run pytest backend/tests -m 'not integration' --junitxml=artifacts/unit.xml
      - name: Validate manifests without connecting to a daemon
        run: |
          python scripts/infra-init-env.py
          docker compose config --quiet
          python scripts/infra-validate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-evidence
          path: artifacts/unit.xml
          if-no-files-found: warn
  compose-integration:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate ephemeral development credentials
        run: python scripts/infra-init-env.py
      - name: Build actual application containers
        run: docker compose build
      - name: Start backend-only core (frontend and gateway not required)
        run: docker compose up -d --wait --wait-timeout 300
      - name: Real MySQL / Kafka / MongoDB / Redis integration and failure recovery
        run: bash scripts/test-integration.sh
      - name: Capture state and redacted logs
        if: always()
        run: |
          mkdir -p artifacts/compose
          docker compose ps --all > artifacts/compose/services.txt
          docker compose logs --no-color --tail=200 2>&1 | python scripts/infra-redact.py > artifacts/compose/services.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-real-integration-evidence
          path: |
            artifacts/
            test-results/*.xml
            !test-results/outage-state.json
            !test-results/**/outage-state.json
          if-no-files-found: warn
      - name: Destroy CI-only ephemeral data
        if: always()
        run: docker compose down --volumes --remove-orphans
  frontend-browser:
    # Separate runner and job: UI verification never replaces backend-only tests above.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package-lock.json
      - name: Frontend clean install, typecheck and production build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Generate private credentials and validate opt-in UI overlay
        run: |
          python scripts/infra-init-env.py
          docker compose -f compose.yaml -f compose.ui.yaml config --quiet
      - name: Build and start real backend with same-origin UI gateway
        run: |
          docker compose -f compose.yaml -f compose.ui.yaml build
          docker compose -f compose.yaml -f compose.ui.yaml up -d --wait --wait-timeout 300
      - name: Real Chromium desktop and mobile end-to-end tests
        env:
          TEST_BASE_URL: http://localhost:8081
          CI: 'true'
        run: bash scripts/test-e2e.sh
      - name: Capture redacted UI-stack diagnostics
        if: always()
        run: |
          mkdir -p artifacts/ui
          docker compose -f compose.yaml -f compose.ui.yaml ps --all > artifacts/ui/services.txt
          docker compose -f compose.yaml -f compose.ui.yaml logs --no-color --tail=200 2>&1 | python scripts/infra-redact.py > artifacts/ui/services.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-evidence
          # Never upload traces, storageState, cookies, session/outage JSON, .env or an entire test directory.
          path: |
            artifacts/ui/services.txt
            artifacts/ui/services.log
            test-results/browser.xml
            test-results/browser-artifacts/**/*.png
            !test-results/**/outage-state.json
            !test-results/**/storageState.json
            !test-results/**/*.zip
          if-no-files-found: warn
      - name: Destroy CI-only UI-stack data
        if: always()
        run: docker compose -f compose.yaml -f compose.ui.yaml down --volumes --remove-orphans
